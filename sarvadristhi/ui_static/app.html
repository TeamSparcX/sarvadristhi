<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarvadristhi Forensic Workbench</title>
<script src="/static/vendor/d3.v7.min.js"></script>
<style>
/* Sarvadristhi light workbench. Layout: fixed sidebar + top bar + scrolling content; proof inspector slides in from the right.
   Surfaces are tinted sage greys (never flat white everywhere); one deep-green ink panel per screen carries the verdict. */
:root{
 --canvas:#eceee8;--side:#f6f7f3;--card:#ffffff;--sunk:#f3f4ef;--tint:#e4efe7;--hover:#eef1ea;
 --ink:#111513;--ink2:#353c37;--mut:#69716a;--dim:#949b94;--line:#dde1d9;--line2:#c8cec5;
 --deep:#122019;--deep2:#1a2b22;--deepfg:#eef6f0;--deepmut:#9db3a5;--mint:#7fe3a6;--mint2:#4fc985;--mint3:#2f9e64;
 --acc:#14704d;--acc-bg:#e2f1e8;
 --ok:#1b7f4f;--ok-bg:#e1f2e7;--warn:#b0620b;--warn-bg:#fcefd9;--crit:#c3352b;--crit-bg:#fbe6e3;--info:#2f62c9;--info-bg:#e6edfb;--lead:#6b48d0;--lead-bg:#eee9fb;
 --idx:#1f9d61;--carv:#d98a0b;--cont:#d4467b;--meta:#3b6fd8;--del:#d23f31;--live:#8a948c;--empty:#e6e9e2;
 --l1:#0e9488;--l2:#3b6fd8;--l3:#7a4fd8;--l4:#e07b16;
 --r:12px;--r2:9px;
 --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
 --disp:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
 --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
 color-scheme:light}
/* Deep Scan: the dark intelligence theme. Same tokens, same meanings; toggled from the sidebar footer. */
:root[data-theme="dark"]{
 --canvas:#05080b;--side:#0a1016;--card:#0d161e;--sunk:#0a1118;--tint:#0f2230;--hover:#112130;
 --ink:#e8f6ff;--ink2:#cfe3ee;--mut:#8aa3b3;--dim:#6a8a9d;--line:#16232e;--line2:#22384a;
 --acc:#34e0ff;--acc-bg:#0e2a33;
 --ok:#39ff9c;--ok-bg:#0d2a1f;--warn:#ffb02e;--warn-bg:#2a1f0b;--crit:#ff3b5c;--crit-bg:#2e0f16;--info:#34e0ff;--info-bg:#0e2430;--lead:#b48cff;--lead-bg:#1e1530;
 --idx:#34e0ff;--carv:#ffb02e;--cont:#ff6b8b;--meta:#e8f6ff;--del:#ff3b5c;--live:#6c7d99;--empty:#1b2a35;
 color-scheme:dark}
:root[data-theme="dark"] body{background:radial-gradient(1100px 700px at 60% 0%,#0b1720 0,transparent 70%),var(--canvas)}
:root[data-theme="dark"] .top{background:rgba(5,8,11,.86);border-bottom-color:var(--line2)}
:root[data-theme="dark"] .banner{color:#ffd28a}
:root[data-theme="dark"] .btn.pri{background:var(--acc);border-color:var(--acc);color:#04121a}
:root[data-theme="dark"] .card{box-shadow:0 0 0 1px rgba(52,224,255,.05)}
:root[data-theme="dark"] .card:before{content:"";position:absolute}
:root[data-theme="dark"] img,:root[data-theme="dark"] video{filter:none}
.themebtn{margin-top:10px;width:100%;justify-content:center}
/* Anveshan */
.av-grid{display:grid;grid-auto-flow:column;grid-auto-columns:118px;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.av-grid .av-t{scroll-snap-align:start}
.av-t{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);cursor:pointer;transition:border-color .15s}
.av-t:hover,.av-t.on{border-color:var(--acc)}.av-t img{width:100%;height:118px;object-fit:cover;display:block;background:#000}
.av-t .c{padding:6px 8px;font-size:11px;line-height:1.35}
.av-r{display:grid;grid-template-columns:86px 1fr 230px;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.av-r img{width:86px;height:96px;object-fit:cover;border-radius:8px;background:#000;cursor:pointer}
.av-bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.av-bar i{display:block;height:100%;background:var(--acc)}
.av-f{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:11.5px;margin:2px 0}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:11.5px}.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-family:var(--disp);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:650;line-height:1.15}h2{font-size:20px;font-weight:650}h3{font-size:15px;font-weight:650}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sp{flex:1}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px;gap:16px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--deep);display:grid;place-items:center;flex:none}
.brand b{font:700 16px/1.1 var(--disp);display:block}.brand small{font-size:11px;color:var(--mut)}
.navh{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:0 10px;margin:4px 0 -6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500}
.nav a:hover{background:var(--hover)}.nav a.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(17,21,19,.05)}
.nav a.on svg{color:var(--acc)}.nav svg{width:16px;height:16px;flex:none;color:var(--mut)}
.nav .cnt{margin-left:auto;font:600 10.5px/1 var(--mono);padding:3px 6px;border-radius:5px;background:var(--crit-bg);color:var(--crit)}
.nav .cnt.ok{background:var(--ok-bg);color:var(--ok)}.nav .cnt.n{background:var(--sunk);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:grid;gap:8px;font-size:11.5px;color:var(--mut)}
.sidefoot b{display:block;color:var(--ink);font:500 11.5px var(--mono)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 24px;background:rgba(236,238,232,.86);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.crumb{color:var(--mut);font-size:13px}.crumb b{color:var(--ink);font-weight:600}.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.page{padding:22px 24px 60px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.flat{background:var(--sunk)}.card.pad0{padding:0;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:#262c28}
.btn.mint{background:var(--mint);border-color:var(--mint);color:var(--deep)}.btn.mint:hover{background:#9aeebb}
.btn.ghostd{background:transparent;border-color:rgba(255,255,255,.22);color:var(--deepfg)}.btn.ghostd:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:5px 10px;font-size:12px}.btn svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink2)}
.pill .dot,.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.3}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-crit{background:var(--crit-bg);color:var(--crit)}
.c-info{background:var(--info-bg);color:var(--info)}.c-lead{background:var(--lead-bg);color:var(--lead)}.c-n{background:var(--sunk);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.c-ink{background:var(--ink);color:#fff}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;height:auto}.page{padding:16px}}
table{width:100%;border-collapse:collapse}th{font:600 10.5px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}tr.del td{background:#fdf3f1}
.tblwrap{overflow-x:auto}
input,select,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%;font:inherit;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
label.lb{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin:12px 0 5px}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:280px;white-space:pre-wrap;font:11.5px/1.5 var(--mono);margin:6px 0;color:var(--ink2)}
details summary{cursor:pointer;color:var(--acc);font-size:12px;font-weight:600;margin:4px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:12.5px}.kv>div:nth-child(odd){color:var(--mut)}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}.bar span{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}.leg span{display:inline-flex;align-items:center;gap:6px}
.sev{width:4px;border-radius:2px;align-self:stretch;flex:none}
.empty{padding:28px;text-align:center;color:var(--mut)}
.note{font-size:12px;color:var(--mut);max-width:80ch}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;font-size:12.5px;background:var(--warn-bg);color:#7a4507}
.banner.info{background:var(--info-bg);color:#1f448f}

/* deep panels: hero, verdict */
.hero{background:var(--deep);color:var(--deepfg);border-radius:16px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden;position:relative;min-height:300px}
.hero .art{position:relative;min-height:280px}.hero .art svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{padding:34px 36px 30px 8px;display:flex;flex-direction:column;gap:14px;justify-content:center;position:relative;z-index:1}
.hero h1{color:#fff;font-size:34px}.hero p{color:var(--deepmut);margin:0;max-width:52ch}
.hero .bul{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--deepfg)}.hero .bul span{display:inline-flex;align-items:center;gap:7px}.hero .bul .dot{color:var(--mint)}
@media(max-width:980px){.hero{grid-template-columns:1fr}.hero .txt{padding:8px 24px 26px}}
.verdict{background:var(--deep);color:var(--deepfg);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.verdict .r{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.verdict .r:last-child{border-bottom:0}.verdict .l{font-size:12px;color:var(--deepmut)}
.verdict .v{font:650 24px/1.15 var(--disp);color:#fff;font-variant-numeric:tabular-nums}.verdict .v small{font:500 12px var(--sans);color:var(--deepmut);margin-left:6px}
.verdict .ic{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(127,227,166,.12);color:var(--mint)}
.verdict .ic.bad{background:rgba(255,120,100,.15);color:#ff8f80}.verdict .ic svg{width:16px;height:16px}

/* features + case cards */
.feat{display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:border-color .12s}
.feat:hover{border-color:var(--line2)}.feat .h{display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px}
.feat .ico{width:34px;height:34px;border-radius:9px;background:var(--tint);color:var(--acc);display:grid;place-items:center;flex:none}.feat .ico svg{width:18px;height:18px}
.feat p{margin:0;color:var(--mut);font-size:12.5px}.feat .go{font-size:12px;font-weight:600;color:var(--acc);margin-top:auto}
.ccard{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-decoration:none}
.ccard:hover{border-color:var(--line2)}
.still{position:relative;background:#1b231e;aspect-ratio:16/9;overflow:hidden}
.still img{width:100%;height:100%;object-fit:cover;display:block}
.osd{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;font:600 11px/1 var(--mono);color:#fff;background:rgba(10,14,12,.62);padding:5px 8px;border-radius:5px}
.rec{color:#ff6b5e}.rec .dot{animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.ccard .b{padding:14px 16px;display:flex;flex-direction:column;gap:8px}

/* command */
.cmdtop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px}
@media(max-width:1100px){.cmdtop{grid-template-columns:1fr}}
.casehero{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.casehero .still{aspect-ratio:auto;min-height:250px}
.casehero .meta{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
@media(max-width:900px){.casehero{grid-template-columns:1fr}.casehero .still{min-height:200px}}
.evc .h{display:flex;align-items:center;gap:10px;font-weight:650}.evc .h svg{width:18px;height:18px;color:var(--ink2)}
.vrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px}
@media(max-width:1100px){.vrow{grid-template-columns:1fr}}
.vtile{position:relative;border-radius:var(--r);overflow:hidden;background:#141a16;min-height:260px}
.vtile video{width:100%;height:100%;display:block;object-fit:contain;max-height:420px}
.cams{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding:1px}
.cam{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.cam:hover{background:var(--hover)}.cam.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.cam img{width:64px;height:38px;object-fit:cover;border-radius:5px;background:#1b231e;flex:none}
.cam .nm{font-weight:600;font-size:12.5px}.cam .mt{font:11px var(--mono);color:var(--mut)}
.fl{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.fl:last-child{border-bottom:0}.fl:hover{background:var(--hover)}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.flag{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--sunk);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.flag:hover{border-color:var(--line2)}.flag.on{background:var(--card)}
.flag .s{font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}.flag.on .s{color:var(--ok)}.flag.off .s{color:var(--dim)}
.flag .t{font-weight:600;font-size:12.5px}.flag .e{font-size:11.5px;color:var(--mut)}
.sent{padding:9px 12px;border-left:3px solid var(--ok);background:var(--sunk);margin:6px 0;border-radius:0 8px 8px 0}.sent.bad{border-color:var(--warn);opacity:.8}

/* case tabs (horizontal) */
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start;max-width:100%}
.tab{padding:7px 12px;border-radius:7px;text-decoration:none;color:var(--mut);font-weight:600;font-size:12.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(17,21,19,.06)}
.tab .n{font:600 10px var(--mono);margin-left:5px;color:var(--dim)}

/* hypotheses */
.hyp{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.hyp.win{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.hyp.lose{background:var(--sunk)}
.hyp .score{font:650 22px/1 var(--disp);font-variant-numeric:tabular-nums}
.chk{display:grid;grid-template-columns:20px minmax(0,1.25fr) minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
.chk .i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.i.y{background:var(--ok-bg);color:var(--ok)}.i.n{background:var(--crit-bg);color:var(--crit)}.i.u{background:var(--sunk);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}

/* reconciliation */
.recon td{min-width:170px}.recon td:first-child{min-width:190px}
.cell{border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;height:100%}
.cell b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.t-ok{background:var(--ok-bg);color:#14583a}.t-warn{background:var(--warn-bg);color:#7a4507}.t-crit{background:var(--crit-bg);color:#8f241c}.t-mut{background:var(--sunk);color:var(--mut)}

/* provenance filmstrip */
.film{display:grid;gap:3px}.film i{display:block;height:34px;border-radius:3px}
.fs-rec i{background:#cfd6cc}.fs-exp i{background:#b9d9c5}.film i.cut{background:var(--crit-bg)!important;outline:1.5px dashed var(--crit);outline-offset:-1.5px}
.film i.gone{visibility:hidden}.film i.only{background:#f3d9a8!important}
.seg{display:flex;height:16px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}.seg div{height:100%}

/* video wall */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pl{position:relative;background:#111;border-radius:10px;overflow:hidden;cursor:pointer}.pl video{width:100%;display:block}
.pl canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pl .cap{position:absolute;left:8px;top:8px;background:rgba(10,14,12,.7);color:#fff;padding:3px 8px;border-radius:5px;font:600 11px var(--mono)}
.pl .prov{position:absolute;right:8px;bottom:8px}
.clock{font:600 26px/1 var(--mono);letter-spacing:.02em}
svg text{fill:var(--mut);font-size:10.5px;font-family:var(--sans)}

/* ask */
.askbox{display:flex;gap:8px}.askbox input{font-size:15px;padding:12px 14px}
.q-ex{display:flex;gap:6px;flex-wrap:wrap}.q-ex button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.q-ex button:hover{background:var(--hover)}
.cites{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cite{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;display:flex;flex-direction:column}

 let fails=0,fill=0;const cells=$$("#strip i");
 const tick=async()=>{let j;try{const r=await fetch("/api/job/"+id);j=await r.json();fails=0;if(!r.ok){$("#jmsg").innerHTML=`<div class="card" style="color:var(--crit)">Job not known to the server. <a href="#/">Back</a></div>`;clearInterval(window._poll);return}}

  $("#jtitle").textContent="Case "+j.case;const L=j.log||[];
  const ev=j.stages||[],cur=ev.length?ev[ev.length-1]:null,seen={},dur={};

  const prog=j.state==="done"?1:Math.max(0,(maxIdx+1)/STAGE_KEYS.length);const want=Math.round(prog*cells.length);

function norm(c){
 if(!c.evidence_items){const fs=c.filesystem;c.evidence_items=[{id:"E1",name:c.case.case_id,path:c.evidence.source,kind:c.case.kind||"recorder-disk",family:c.detection.family,confidence:c.detection.confidence,
  candidates:c.detection.candidates||[],coverage:{level:fs?"external tool, widely validated":"see method",basis:fs?"The Sleuth Kit":"single-item case"},hash:c.evidence.before,unchanged:c.evidence.unchanged,bytes:c.evidence.bytes,
  recovery:c.recovery,filesystem:fs,custody:c.custody.status,custody_ok:c.custody.ok,dir:"",cameras:c.cameras}];
  for(const k of c.clips){k.evidence=k.evidence||"E1";k.device=k.device||c.case.case_id;k.camera=k.camera||k.label||("Camera "+k.channel);
   k.provenance=k.provenance||(k.evidence_level==="index-confirmed"?"index":"carved");k.time_source=Array.isArray(k.time_source)?k.time_source[0]:k.time_source;}}
 for(const k of c.clips){k.label=k.label||k.camera||k.id}
 c.byClip={};for(const k of c.clips)c.byClip[k.id]=k;
 c.ai=c.ai||{};c.reviews=c.reviews||{};return c}

 return [
  ["command","The seizure",`${c.evidence_items.length} evidence item(s), opened read-only. Hashes before and after analysis are ${c.evidence.unchanged?"identical":"DIFFERENT"}; the custody chain is ${c.custody_now.ok?"intact":"broken"}.${po.length?` ${po.filter(p=>p.caught).length} of ${po.length} planted manipulations caught.`:""}`],
  ["hypotheses","Roopnirnay · the bytes decide","Every parser tests every disk. The winning interpretation shows the structures it explains; brand labels on the disk are weak context and are reported when they disagree."],
  ["disk","Recovery from formatted space","Each cell is a slice of the seized image: green is in the recorder's live index, amber was carved from space the index no longer lists. Click any cell to read the original bytes."],
  ["reconcile","Ekmatpatra · where sources disagree","Recorder index, frames on disk, recorder log, burned-in clock and exported copies, camera by camera. Disagreements are stated, not hidden."],
  ["provenance","The edited export",edit?`Frame-by-frame matching against the recorder shows ${(edit.frames_removed/(c.byClip[pv.export]||{fps:10}).fps||0).toFixed(1)} s removed: ${edit.summary}`:"Exports are matched frame by frame against recorder footage."],

 ${c.evidence_items.map(e=>{const r=cur[e.id],k=c.clips.find(x=>x.evidence===e.id&&x.start_ms);return `<tr><td><b>${esc(e.id)}</b> · ${esc(e.name)}</td><td class="num">${r?(r.offset_s>0?"+":"")+r.offset_s+" s":"none"}</td><td class="small">${r?esc(r.reason):"—"}</td>
  <td class="mono tiny">${k?`recorder ${hms(k.start_ms)}${r?` → real ${hms(k.start_ms+r.offset_s*1000)}`:""}`:"—"}</td>
  <td><div class="row" style="flex-wrap:nowrap;gap:6px"><input id="ko_${e.id}" type="number" step="0.1" placeholder="s" style="width:80px"><input id="kr_${e.id}" placeholder="basis (e.g. vs NTP phone at seizure)" style="min-width:200px"><button class="btn sm" onclick="setKaal('${e.id}')">Save</button></div></td></tr>`}).join("")}</table></div>
 ${o.history.length?`<details style="margin-top:8px"><summary>history (${o.history.length})</summary>${o.history.map(h=>`<div class="tiny">${esc(h.utc)} · ${esc(h.evidence)} ${h.offset_s>0?"+":""}${h.offset_s} s · ${esc(h.reason)} · ${esc(h.examiner)}</div>`).join("")}</details>`:""}`}
async function setKaal(eid){const r=await api(`/api/case/${encodeURIComponent(CDIR)}/offset`,{method:"POST",body:JSON.stringify({evidence:eid,offset_s:+$("#ko_"+eid).value,reason:$("#kr_"+eid).value,examiner:localStorage.exm||CASE.case.examiner})});
 if(r.error){toast(r.error);return}toast(`Kaalshodhan: ${eid} ${r.offset_s>0?"+":""}${r.offset_s} s logged to custody`);kaalshodhanCard(CASE)}
async function examinerLists(c){const box=$("#exlists");if(!box)return;const [N,S]=await Promise.all([api(`/api/case/${encodeURIComponent(CDIR)}/notes`),api(`/api/case/${encodeURIComponent(CDIR)}/segments`)]);const F=window.F;
 box.innerHTML=`<div class="card"><div class="hd"><h3>Sakshilekh</h3><span class="tiny mut">${N.length} examiner finding(s) · go to Timeline &amp; video to add one</span></div>${N.length?`<div class="cites">${N.map(n=>`<div class="cite" onclick="jump(${n.recorder_from_ms||0})">${n.frame?`<img src="${F(n.frame)}">`:""}<div class="c"><b>${esc(n.id)} · ${esc(n.text)}</b><span class="mono">${n.recorder_from_ms?hmsms(n.recorder_from_ms):n.from_s+" s"}</span><span class="mut">${esc(n.camera||"")}</span><span class="dim">${esc(n.examiner)} · ${esc(n.utc)}</span></div></div>`).join("")}</div>`:`<div class="mut small">None yet.</div>`}</div>
 <div class="card pad0"><div class="hd" style="padding:14px 18px 0"><h3>Khandmudra</h3><span class="tiny mut">${S.length} exported segment(s)</span></div>${S.length?`<div class="tblwrap"><table><tr><th>ID</th><th>Camera</th><th>Interval</th><th>Frames</th><th>Purpose</th><th>SHA-256</th><th></th></tr>${S.map(s=>`<tr><td class="mono">${s.id}</td><td class="small">${esc(s.camera||"")}</td><td class="num">${s.asked_from_s.toFixed(1)}–${s.asked_to_s.toFixed(1)} s</td><td class="num">${s.frames}</td><td class="small">${esc(s.purpose)}</td><td class="mono tiny">${s.sha256.slice(0,24)}…</td><td><a class="btn sm" href="${F(s.file)}" target="_blank">Open</a></td></tr>`).join("")}</table></div>`:`<div class="empty">None yet.</div>`}</div>`}

window.addEventListener("hashchange",route);route();
</script>
